<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Sports App</title>

    <!-- THIS is what was missing -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- App container -->
<div id="app">

    <!-- Pages (swipeable) -->
    <div id="pages">

        <section class="page" id="stats">
            <h2>Stats</h2>
            <div class="card">Calculation 1</div>
            <div class="card">Calculation 2</div>
            <div class="card">Calculation 3</div>
        </section>

        <section class="page" id="home">
            <h2>Home</h2>
            <div class="card">
                <h3>Current Year vs Average Year</h3>
                <canvas id="graph-year-vs-average" width="400" height="200"></canvas>
            </div>
            <div class="card">
                <h3>Current Year vs Past Years</h3>
                <canvas id="graph-year-vs-past" width="400" height="200"></canvas>
            </div>
        </section>

        <section class="page" id="missing">
            <h2>Missing Runs</h2>
            <div class="card">Jan 3</div>
            <div class="card">Jan 7</div>
        </section>

    </div>

    <!-- Bottom navigation -->
    <nav id="bottom-nav">
        <button onclick="goToPage(0)">📊</button>
        <button onclick="goToPage(1)">🏠</button>
        <button onclick="goToPage(2)">📅</button>
    </nav>

    <!-- Floating Add Button -->
    <button id="add-button" onclick="openModal()">＋</button>

</div>

<!-- Modal -->
<div id="modal">
    <div id="modal-content">
        <h3>Add Run</h3>
        <label for="run-date" class="visually-hidden">Date</label>
        <input type="date" id="run-date">

        <label for="run-distance" class="visually-hidden">Distance (km)</label>
        <input type="number" id="run-distance" placeholder="Distance (km)">

        <label for="run-time" class="visually-hidden">Time (minutes)</label>
        <input type="number" id="run-time" placeholder="Time (min)">

        <button id="add-run-confirm">Add</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
