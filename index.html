<body>

<!-- App container -->
<div id="app">


    <!-- Pages (swipeable) -->
    <div id="pages">

        <section class="page" id="stats">
            <h2>Stats</h2>
            <div class="card">Calculation 1</div>
            <div class="card">Calculation 2</div>
            <div class="card">Calculation 3</div>
        </section>

        <section class="page" id="home">
            <h2>Home</h2>
            <div class="card">Yearly graph (placeholder)</div>
            <div class="card">Another graph (placeholder)</div>
        </section>

        <section class="page" id="missing">
            <h2>Missing Runs</h2>
            <div class="card">Jan 3</div>
            <div class="card">Jan 7</div>
        </section>

    </div>

    <!-- Bottom navigation -->
    <nav id="bottom-nav">
        <button onclick="goToPage(0)">📊</button>
        <button onclick="goToPage(1)">🏠</button>
        <button onclick="goToPage(2)">📅</button>
    </nav>

    <!-- Floating Add Button -->
    <button id="add-button" onclick="openModal()">＋</button>

</div>

<!-- Modal -->
<div id="modal">
    <div id="modal-content">
        <h3>Add Run</h3>
        <p>(Form goes here later)</p>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script src="app.js"></script>
</body>
